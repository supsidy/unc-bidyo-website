name: Link Check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - "src/**"

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress
            --exclude-mail
            './**/*.md'
            './src/**/*.jsx'
          fail: false

      - name: Create summary
        run: cat lychee/out.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
